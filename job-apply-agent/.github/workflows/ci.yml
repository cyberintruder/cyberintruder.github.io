name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries for PDF rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check jobapply tests scripts

      - name: Test
        run: pytest -q
        env:
          JOBAPPLY_DATA_DIR: ${{ runner.temp }}/jobapply-data

      - name: Smoke-test the CLI
        run: |
          jobapply init
          jobapply resumes list
          jobapply plan "Cloud Security Engineer" --location "Bengaluru, India"
        env:
          JOBAPPLY_DATA_DIR: ${{ runner.temp }}/jobapply-data
