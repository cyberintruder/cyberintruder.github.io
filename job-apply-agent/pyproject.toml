[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-apply-agent"
version = "0.1.0"
description = "Autonomous LinkedIn job application agent: discover, match the right resume, apply, and track."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "anthropic>=0.40",
  "playwright>=1.47",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "markdown-it-py>=3.0",
  "weasyprint>=62.0",
  "pypdf>=4.2",
  "google-api-python-client>=2.130",
  "google-auth-oauthlib>=1.2",
  "google-auth>=2.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
jobapply = "jobapply.cli:app"

[tool.setuptools.packages.find]
include = ["jobapply*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: str+Enum is deliberate — SQLAlchemy's Enum column type and the JSON
# serialisation in the web API both rely on the members being real strings.
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
